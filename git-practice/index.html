<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ブランチ変更練習</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Git練習サイト</h1>
    <p id="message">GitHubの操作を練習しよう！</p>
    <button id="change-message">メッセージを変更</button>
    <section>
      <h2>練習メニュー</h2>
      <ul>
        <li>文章を変更してcommitする</li>
        <li>CSSで色を変更する</li>
        <li>新しいブランチで機能を追加する</li>
        <li>Pull Requestでmainに取り込む</li>
      </ul>
    </section>
  </main>
</body>
</html>
